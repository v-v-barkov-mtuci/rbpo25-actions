name: Pull Request

on:
  pull_request:
    branches:
      - master
  #push:
  #  branches:
  #    - gh_actions

jobs:
  build:
    runs-on: ubuntu-latest
    container: eclipse-temurin:21-jdk
    steps:
      - name: Getting source code
        uses: actions/checkout@v3
      - run: chmod u+x ./mvnw
      - run: ./mvnw package
      - uses: actions/upload-artifact@v4
        with:
          name: vuln
          path: ./target