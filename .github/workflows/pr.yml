name: Pull Request

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - gh_actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Getting source code
        uses: actions/checkout@v3
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: x64
      - run: chmod u+x ./mvnw
      - run: ./mvnw package
      - uses: action/upload-artifact@v4
        with:
          name: vuln
          path: ./target